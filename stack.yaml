services:
  web:
    image: localhost:6009/golenev-09/probe:${VERSION}
    environment:
      MARKER: applab
      APP_PORT: "5009"
      DATABASE_URL: postgresql://postgres:lab@db:5432/lab
    ports:
      - "8027:5009"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5009/notes', timeout=10).read()"]
      interval: 3s
      retries: 3
    networks: [net]
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
        monitor: 20s
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    volumes:
      - data:/var/lib/postgresql/data
    networks: [net]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "postgres"]
      interval: 2s
      retries: 30
networks:
  net:
    ipam:
      config:
        - subnet: 10.29.0.0/24
volumes:
  data:
